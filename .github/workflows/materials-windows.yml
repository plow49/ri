name: Build M Materials Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, 'preview/**']
    tags: ['materials-v*']
    paths:
      - 'material_manager/**'
      - '.github/workflows/materials-windows.yml'
permissions:
  contents: read
jobs:
  windows-exe:
    # Do not run potentially billable private-repository builds without approval.
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: material_manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tool
        run: python -m pip install pyinstaller==6.16.0 pillow==12.0.0
      - name: Test data operations
        run: python -m unittest -v
      - name: Build executable with M icon
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name '물품관리' --icon assets/inventory.ico --add-data 'assets;assets' app.py
      - name: Verify packaged executable
        run: |
          @'
          import pathlib, subprocess
          exe = pathlib.Path('dist/물품관리.exe').resolve()
          result = subprocess.run([str(exe), '--smoke-test'], timeout=90)
          if result.returncode:
              log = pathlib.Path('smoke-error.txt')
              if log.exists(): print(log.read_text(encoding='utf-8'))
              raise SystemExit(result.returncode)
          if pathlib.Path('dist/materials.db').exists():
              raise SystemExit('Smoke test must not create user data beside EXE')
          print('Packaged Windows GUI, icon loading, and SQLite check passed')
          '@ | python -
      - name: Capture Windows interface previews
        run: python capture_preview.py
      - name: Prepare download
        run: |
          Copy-Item EXE-사용방법.txt dist/
          Get-FileHash 'dist/물품관리.exe' -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M-Materials-Windows-EXE
          path: |
            material_manager/dist/물품관리.exe
            material_manager/dist/EXE-사용방법.txt
            material_manager/dist/SHA256.txt
            material_manager/dist/UI-*.png
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/materials-v') && github.event.repository.private == false
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: M-Materials-Windows-EXE
          path: release-files
      - name: Publish verified executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp 'release-files/물품관리.exe' release-files/M-Materials.exe
          gh release create "$RELEASE_TAG" release-files/M-Materials.exe release-files/EXE-사용방법.txt release-files/SHA256.txt release-files/UI-*.png --verify-tag --title "M_물품관리 $RELEASE_TAG" --notes-file release-files/EXE-사용방법.txt
